plugins {
    id 'com.android.application'
}

android {
    namespace 'org.triliumnotes.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "org.triliumnotes.mobile"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Named so the APK handed over is obviously a debug build.
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web bundle is staged here by build-apk.sh; it is a build input, not source.
    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
